name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core and release audits
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Rust check
        run: cargo check --workspace --all-targets --locked
      - name: Rust lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust tests
        run: cargo test --workspace --release --locked
      - name: Release audit
        shell: pwsh
        run: ./scripts/audit.ps1
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $errors = $null
          Get-ChildItem scripts -Filter '*.ps1' | ForEach-Object {
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors) { throw ($errors | Out-String) }
          }
      - name: JSON configuration syntax
        shell: pwsh
        run: |
          Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json | Out-Null
          Get-Content app/src-tauri/tauri.release.conf.json -Raw | ConvertFrom-Json | Out-Null
      - name: Desktop JavaScript syntax
        run: node --check app/ui/app.js

  desktop:
    name: Tauri command boundary
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Desktop check
        run: cargo check --manifest-path app/src-tauri/Cargo.toml --locked
      - name: Desktop lint
        run: cargo clippy --manifest-path app/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Desktop tests
        run: cargo test --manifest-path app/src-tauri/Cargo.toml --locked
