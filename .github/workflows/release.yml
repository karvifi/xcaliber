name: Windows release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows:
    name: CLI and NSIS installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Validate source
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --workspace --all-targets --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo check --manifest-path app/src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path app/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path app/src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check app/ui/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test app/tests/core.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/audit.ps1
      - name: Build release
        shell: pwsh
        run: ./scripts/build-release.ps1
      - name: Attest release files
        uses: actions/attest@v4
        with:
          subject-path: dist/release/*
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: xcaliber-windows-${{ github.ref_name }}
          path: dist/release/*
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --verify-tag --generate-notes --title "Xcaliber $env:GITHUB_REF_NAME"
          }
          gh release upload $env:GITHUB_REF_NAME dist/release/* --clobber
