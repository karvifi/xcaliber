[package]
name = "xcaliber-desktop"
version = "1.1.0"
description = "Local Kimi K3 hardware planner and runtime controller"
authors = ["Xcaliber contributors"]
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/karvifi/xcaliber"

[lib]
name = "xcaliber_desktop_lib"
# This release targets Windows desktop only. Mobile library artifacts are not
# needed and GNU PE/COFF cannot export Tauri's generated symbol set as a DLL.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.11.5", features = [] }

[workspace]
