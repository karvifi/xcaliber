[package]
name = "xcaliber-cli"
version = "1.2.0"
edition = "2021"
rust-version = "1.83"
license = "AGPL-3.0-only"
description = "Local-only Kimi K3 model manager and native inference launcher"
repository = "https://github.com/karvifi/xcaliber"

[[bin]]
name = "xcaliber"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
